services:
  postgres:
    image: postgres:16
    container_name: databot-pg
    environment:
      POSTGRES_USER: databot
      POSTGRES_PASSWORD: databot
      POSTGRES_DB: shop
    ports:
      - "5433:5432"
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U databot -d shop"]
      interval: 1s
      timeout: 3s
      retries: 60
